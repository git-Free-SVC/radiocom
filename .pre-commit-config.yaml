repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.5.6
    hooks:
      - id: ruff
        args: [--fix]
  - repo: https://github.com/psf/black
    rev: 24.4.2
    hooks:
      - id: black
  - repo: local
    hooks:
      - id: pytest-unit
        name: pytest (unit + contract, fakes only)
        entry: pytest tests/ -q
        language: system
        pass_filenames: false
        stages: [pre-push]
