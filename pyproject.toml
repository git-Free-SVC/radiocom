[project]
name = "radiocom"
version = "0.0.1"
description = "RADIOCOM SIMULATOR — modular RF/network/GIS simulation platform"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "pydantic>=2.7",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "pytest>=9.1.1",
    "pyyaml>=6.0.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "black>=24.0",
    "pre-commit>=3.7",
    "openapi-spec-validator>=0.7",
    "jsonschema>=4.22",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]    # makes `libraries` and `tests.contract.fakes` importable
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.black]
line-length = 100
target-version = ["py312"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["libraries*", "services*"]
